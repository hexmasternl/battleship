name: Dev container

# Builds the dev container whenever its definition changes and runs the smoke check inside it:
# every tool on PATH, Dapr initialised, the solution builds and the backend unit tests pass.
# The image is only built, never pushed. See .devcontainer/ and docs/prerequisites.md.

on:
  push:
    branches: [main, development]
    paths:
      - .devcontainer/**
      - .gitattributes
      - .github/workflows/devcontainer.yml
  pull_request:
    branches: [main, development]
    paths:
      - .devcontainer/**
      - .gitattributes
      - .github/workflows/devcontainer.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: devcontainer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke-check:
    name: Build and smoke-check the dev container
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Build the dev container and run the smoke check
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: bash .devcontainer/smoke-check.sh
