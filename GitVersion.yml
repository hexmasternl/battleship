# Semantic version of each deployment (see .github/workflows/deploy.yml). Releases come from main;
# the deploy workflow tags each successful release v<SemVer>, so the next commit gets a higher version.
# Conventional-commit messages since the last release decide the bump: a breaking change bumps major,
# feat bumps minor, anything else bumps patch.
workflow: GitHubFlow/v1
tag-prefix: '[vV]?'
next-version: 0.1.0
major-version-bump-message: '^(build|chore|ci|docs|feat|fix|perf|refactor|revert|style|test)(\([\w\s\-,/\\]*\))?!:|BREAKING CHANGE:'
minor-version-bump-message: '^feat(\([\w\s\-,/\\]*\))?:'
patch-version-bump-message: '^(build|chore|ci|docs|fix|perf|refactor|revert|style|test)(\([\w\s\-,/\\]*\))?:'
no-bump-message: '\+semver:\s?(none|skip)'
branches:
  main:
    mode: ContinuousDeployment
    increment: Patch
    label: ''
