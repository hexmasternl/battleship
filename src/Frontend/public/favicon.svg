<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="70%">
      <stop offset="0" stop-color="#0b2e4a"/>
      <stop offset="1" stop-color="#011627"/>
    </radialGradient>
    <linearGradient id="sweep" x1="256" y1="256" x2="420" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00c0ff" stop-opacity="0"/>
      <stop offset="1" stop-color="#00c0ff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="hull" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#63cdff"/>
      <stop offset="1" stop-color="#0097c9"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="tile"><rect width="512" height="512" rx="112"/></clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#bg)"/>

    <!-- radar -->
    <g fill="none" stroke="#00c0ff" stroke-opacity="0.35" stroke-width="4">
      <circle cx="256" cy="256" r="200"/>
      <circle cx="256" cy="256" r="136"/>
      <circle cx="256" cy="256" r="72"/>
      <path d="M256 40V472M40 256H472" stroke-opacity="0.2"/>
    </g>
    <path d="M256 256 L456 256 A200 200 0 0 0 397.4 114.6 Z" fill="url(#sweep)"/>
    <path d="M256 256 L397.4 114.6" stroke="#92daff" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>

    <!-- hit -->
    <g filter="url(#glow)">
      <circle cx="356" cy="168" r="22" fill="none" stroke="#ff2146" stroke-width="5"/>
      <circle cx="356" cy="168" r="10" fill="#ff2146"/>
    </g>

    <!-- waves -->
    <path d="M60 372 q24 -14 48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0 t48 0" fill="none" stroke="#00c0ff" stroke-opacity="0.5" stroke-width="6" stroke-linecap="round"/>

    <!-- ship -->
    <g fill="url(#hull)" stroke="#011627" stroke-width="4" stroke-linejoin="round">
      <path d="M180 300 h28 v-40 h40 v-36 h36 v36 h20 v-20 h26 v60 h28 Z"/>
      <path d="M252 224 v-34" stroke="#63cdff" stroke-width="6" stroke-linecap="round"/>
      <path d="M150 300 v-16 h36 v16 M334 300 v-16 h36 v16"/>
      <path d="M150 290 h-36 M370 290 h36" stroke="#63cdff" stroke-width="6" stroke-linecap="round"/>
      <path d="M76 300 H436 L408 350 H112 Z"/>
    </g>
  </g>
</svg>
