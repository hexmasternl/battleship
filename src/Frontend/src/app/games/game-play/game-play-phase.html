<section class="play" aria-labelledby="play-title">
  <h2 id="play-title" class="play__title">Battle</h2>

  <p class="play__turn" [class.is-mine]="store.myTurn()" role="status" aria-live="polite">
    {{ turnText() }}
  </p>

  <mat-tab-group
    class="play__tabs"
    [selectedIndex]="selectedTab()"
    (selectedIndexChange)="selectedTab.set($event)"
  >
    <mat-tab label="You">
      <battle-target-grid
        class="play__grid"
        [shots]="store.myShots()"
        [target]="store.target()"
        [canShoot]="store.canShoot()"
        (cellSelected)="store.selectTarget($event)"
        (cleared)="store.clearTarget()"
      />
    </mat-tab>
    <mat-tab label="Opponent">
      <battle-fleet-grid
        class="play__grid"
        [ships]="store.placedShips()"
        [shots]="store.opponentShots()"
      />
    </mat-tab>
  </mat-tab-group>
</section>
