<form class="display-name" novalidate (submit)="submit($event)">
  <div class="bs-field">
    <label class="bs-field__label" [for]="inputId">Player name</label>
    <input
      class="bs-input"
      type="text"
      autocomplete="nickname"
      [id]="inputId"
      [formField]="store.form.displayName"
      [attr.aria-invalid]="store.nameError() !== null"
      [attr.aria-describedby]="store.nameError() !== null ? errorId : null"
    />
    @if (store.nameError(); as message) {
      <p class="bs-field__hint bs-field__hint--error" [id]="errorId">{{ message }}</p>
    }
  </div>

  @if (store.error(); as message) {
    <p class="bs-status bs-status--danger" role="alert">{{ message }}</p>
  }

  <button class="bs-btn bs-btn--primary" type="submit" [disabled]="store.submitting()">
    Take command
  </button>
</form>
